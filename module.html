<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a2e">
<title>Module EMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
<script src="player/main.bundle.js"></script>
<script src="progression.js"></script>
</head>
<body class="page-module">
<header class="barre">
  <a class="retour" href="index.html">← Tous les modules</a>
  <div class="barre-titre"><span id="num" class="pastille"></span><h1 id="titre">Chargement…</h1></div>
  <span id="statut" class="statut"></span>
  <a id="suivant" class="retour suivant" hidden>Module suivant →</a>
</header>
<main class="lecteur">
  <div id="h5p"></div>
  <section id="compagnon" class="compagnon" hidden>
    <h2><span class="pastille">+</span> <span id="compagnon-titre"></span></h2>
    <p id="compagnon-intro" class="compagnon-intro"></p>
  </section>
  <a id="suite" class="suite" hidden><span class="suite-lib">Module suivant</span><span class="suite-titre"><span id="suite-num" class="pastille"></span> <span id="suite-nom"></span></span><span class="suite-fleche" aria-hidden="true">→</span></a>
  <p class="note">Ta progression est enregistrée automatiquement dans ce navigateur : tu peux t’arrêter et reprendre plus tard, sur le même appareil.</p>
</main>
<script>
(async function () {
  const q = new URLSearchParams(location.search), id = q.get('m');
  // ?dans=1 : module compagnon, affiché dans un cadre sous le module principal
  const dans = q.get('dans') === '1' && window.parent !== window;
  if (dans) document.documentElement.classList.add('integre');
  const mods = await (await fetch('modules.json')).json();
  const m = mods.find(x => x.id === id) || mods.map(x => x.compagnon).find(c => c && c.id === id);
  if (!m) { document.getElementById('titre').textContent = 'Module introuvable'; return; }
  document.title = m.titre + ' · EMI ' + m.niveau;
  document.body.style.setProperty('--niv', 'var(--c' + m.niveau[0] + ')');
  document.getElementById('titre').textContent = m.titre;
  document.getElementById('num').textContent = m.num || 'Game Map';
  // module suivant du même niveau (après le 9e livre : la Game Map ; après la Game Map : rien)
  const niveau = mods.filter(x => x.niveau === m.niveau);
  const apres = niveau[niveau.findIndex(x => x.id === m.id) + 1];
  if (apres && !dans) {
    const lien = 'module.html?m=' + encodeURIComponent(apres.id);
    const haut = document.getElementById('suivant');
    haut.href = lien; haut.title = (apres.num || 'Game Map') + ' · ' + apres.titre; haut.hidden = false;
    const bas = document.getElementById('suite');
    bas.href = lien; bas.hidden = false;
    document.getElementById('suite-num').textContent = apres.num || 'Game Map';
    document.getElementById('suite-nom').textContent = apres.titre;
  }
  // module compagnon (ex. le scénario à embranchements d'un livre) : dans un cadre, sous le livre
  if (m.compagnon && !dans) {
    const c = m.compagnon, sec = document.getElementById('compagnon');
    document.getElementById('compagnon-titre').textContent = c.titre;
    document.getElementById('compagnon-intro').textContent = c.intro || '';
    const fr = document.createElement('iframe');
    fr.className = 'cadre-compagnon'; fr.title = c.titre; fr.src = 'module.html?m=' + encodeURIComponent(c.id) + '&dans=1';
    sec.append(fr); sec.hidden = false;
    const ajuste = () => { try { const d = fr.contentDocument; if (d && d.body) fr.style.height = d.documentElement.scrollHeight + 'px'; } catch (e) {} };
    fr.addEventListener('load', () => { ajuste(); try { new ResizeObserver(ajuste).observe(fr.contentDocument.body); } catch (e) {} });
    setInterval(ajuste, 1500);
  }
  const statut = document.getElementById('statut');
  const montre = (p) => {
    const sc = p.meilleur ? ' · score ' + Math.round(p.meilleur * 100) + ' %' : '';
    statut.textContent = p.termine ? 'Terminé' + sc
      : (p.avance ? Math.round(p.avance * 100) + ' % du livre' : 'Commencé') + sc;
    statut.className = 'statut ' + (p.termine ? 'ok' : 'encours');
  };
  montre(EMI.maj(id, p => Object.assign(p, { commence: p.commence || Date.now(), vu: Date.now() })));
  // l'état de reprise n'est valable que pour la version du module qui l'a produit :
  // un état d'une ancienne version (chapitres ou éléments différents) fait planter le livre
  const version = await fetch('./modules/' + id + '/content/content.json', { cache: 'no-cache' })
    .then(r => r.text()).then(t => { let h = 5381; for (let k = 0; k < t.length; k++) h = (h * 33 + t.charCodeAt(k)) >>> 0; return h.toString(36) + '-' + t.length; })
    .catch(() => '');
  let precedent = null;
  try { const e = JSON.parse(EMI.etat(id) || 'null'); if (e && e.version && e.version === version) precedent = e.etat; } catch (e) {}
  const options = {
    h5pJsonPath: './modules/' + id, librariesPath: './libraries',
    frameJs: './player/frame.bundle.js', frameCss: './player/styles/h5p.css',
    frame: false, fullScreen: true, id: id,
    saveFreq: 3600,
  };
  if (precedent) options.contentUserData = [{ state: precedent }];
  await new H5PStandalone.H5P(document.getElementById('h5p'), options);
  // le contenu tourne dans une iframe : son H5P n'est pas celui de la page
  const instance = () => {
    const fr = document.querySelector('#h5p iframe');
    const h = fr && fr.contentWindow && fr.contentWindow.H5P ? fr.contentWindow.H5P : window.H5P;
    return (h.instances || [])[0];
  };
  // relevé : score actuel, chapitres terminés (livre), état pour la reprise
  const releve = (fini) => {
    const i = instance();
    if (!i) return;
    try { const st = i.getCurrentState && i.getCurrentState(); if (st && version) EMI.garderEtat(id, JSON.stringify({ version, etat: JSON.stringify(st) })); } catch (e) {}
    montre(EMI.maj(id, p => {
      p.vu = Date.now();
      try {
        const max = i.getMaxScore && i.getMaxScore();
        if (max) { const sc = i.getScore() / max; p.score = sc; p.meilleur = Math.max(p.meilleur || 0, sc); }
      } catch (e) {}
      if (Array.isArray(i.chapters)) {
        const ch = i.chapters.filter(c => !c.isSummary);
        const lus = ch.filter(c => c.completed).length;
        p.avance = ch.length ? lus / ch.length : 0;
        if (ch.length && lus === ch.length) p.termine = p.termine || Date.now();
      }
      if (fini) p.termine = p.termine || Date.now();
      return p;
    }));
  };
  setInterval(() => releve(false), 8000);
  addEventListener('pagehide', () => releve(false));
  document.addEventListener('visibilitychange', () => { if (document.hidden) releve(false); });
  H5P.externalDispatcher.on('xAPI', (ev) => {
    const st = ev.data.statement;
    const verbe = (st.verb && st.verb.id || '').split('/').pop();
    // le module entier (pas un chapitre ni une question) annonce qu'il est fini
    const racine = st.object && !String(st.object.id).includes('subContentId');
    setTimeout(() => releve(racine && verbe === 'completed'), 300);
  });
})();
</script>
</body>
</html>
